name: Disposable native visual probe
on:
  push:
    branches: [qa/native-visual-20261109]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Existing pinned layout dependencies only
        run: |
          python3 -m venv "$RUNNER_TEMP/qa-python"
          "$RUNNER_TEMP/qa-python/bin/python" -m pip install --require-hashes -r distribution/dmg/requirements.txt
          echo "$RUNNER_TEMP/qa-python/bin" >> "$GITHUB_PATH"
      - name: Observe the downloaded candidate without rebuilding
        run: |
          npm --prefix Benchmarks ci --ignore-scripts
          (cd Benchmarks && npx playwright install chromium)
          python3 qa/run-native-workflow.py
      - name: Encrypt raw evidence before uploading
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/native-evidence"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/evidence.tar" native-evidence
          openssl cms -encrypt -binary -aes256 -in "$RUNNER_TEMP/evidence.tar" -out "$RUNNER_TEMP/evidence.cms" -outform DER qa/evidence-public.crt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: encrypted-native-visual-evidence
          path: ${{ runner.temp }}/evidence.cms
          if-no-files-found: error
          retention-days: 3
