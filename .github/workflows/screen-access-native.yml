name: Disposable macOS 26 permission UI follow-up
on:
  push:
    branches: [qa/screen-access-native]
permissions:
  contents: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm disposable macOS 26 and unchanged product inputs
        run: |
          sw_vers
          [[ "$(sw_vers -productVersion)" == 26.* ]]
          git diff --exit-code 65d2c4f2756db06f33034667a4a7c0eb10fda40d -- Sources scripts distribution config
      - name: Build clearly labeled synthetic UI failure fixtures
        env:
          CONTEXTLENS_SIGN_IDENTITY: '-'
        run: |
          python3 qa/observe.py inject-ui
          scripts/build-app.sh --output "$RUNNER_TEMP/ui-unpacked"
      - name: Inspect failure-state UI without approving or denying prompts
        run: python3 qa/observe.py ui
      - name: Encrypt all private evidence before upload
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/native-evidence"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/evidence.tar" native-evidence
          openssl cms -encrypt -binary -aes256 -in "$RUNNER_TEMP/evidence.tar" -out "$RUNNER_TEMP/evidence.cms" -outform DER qa/evidence-public.crt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: encrypted-permission-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence.cms
          if-no-files-found: error
          retention-days: 3
